[package]
name = "sage"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["stream"] }
indicatif = "0.18.6"
encoding_rs = "0.8"
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.12.0"

[dependencies.llama-cpp-2]
version = "0.1"
default-features = false
features = ["metal"]  # macOS Apple Silicon
